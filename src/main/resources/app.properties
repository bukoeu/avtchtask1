# Number of threads in the CommandProcessor thread pool
command.processor.threads=4

# Max writes per SQLite transaction (group commit). Higher = fewer transactions, better throughput.
db.write.batch.size=100

# SQLite write configuration
# db.writer.threads: dedicated writer threads (1 is optimal for a single SQLite file)
# db.write.batch.size: writes per transaction — higher = fewer, larger transactions = higher throughput
db.writer.threads=1
db.write.batch.size=100
