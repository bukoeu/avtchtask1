name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build with Maven
        run: mvn -B package --file pom.xml -DskipTests

      - name: Run all tests
        run: mvn test --no-transfer-progress

      - name: Archive timing chart
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: write-timing.html
          path: target/write-timing.html
